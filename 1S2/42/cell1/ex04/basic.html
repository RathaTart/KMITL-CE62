<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Basic</title>
    <style>
      body {
        background-color: pink;
      }
      .main-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .picture-container {
        display: flex;
        max-width: 300px;
        justify-content: center;
        align-items: center;
      }
      .picture-frame {
        display: flex;
        flex-direction: column;
      }

      .title {
        font-size: 30px;
        font-weight: bolder;
        color: white;
      }

      img {
        width: 300px;
        height: 200px;
        margin: 10px;
      }
      a {
        text-decoration: underline;
        color: blue;
        text-align: center;
      }
      hr {
        height: 3px;
        background-color: black;
      }
      .footer {
        font-size: 20px;
        font-family: monospace;
        font-style: italic;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <h1 style = "color: white">&#8723;(>_<)&#8724; Hello, World! </h1>
      <div class="picture-container">
        <span class="picture-frame">
          <img
            src="https://deo.shopeemobile.com/shopee/shopee-mobilemall-live-sg/homepagefe/26c9324913c021677768c36975d635ef.png"
            alt=""
          />
          <a
            href="https://shopee.co.th/"
            >Shopee</a
          >
        </span>
        <span class="picture-frame">
          <img
            src="https://assets.brandinside.asia/uploads/2019/06/Lazada-logo.jpg"
            alt=""
          />
          <a
            href="https://s.lazada.co.th/"
            >Lazada
          </a>
        </span>
      </div>
    </div>
    <hr />
    <div class="footer">© rrotruch 2024</div>
  </body>
</html>
