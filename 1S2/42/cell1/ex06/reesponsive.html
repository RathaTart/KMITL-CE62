<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tab</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }
      .table {
        display: flex;
        height: 100%;
      }
      .box {
        border: 1px solid black;
        flex-grow: 1;
        padding: 50px 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="table">
      <div class="box" style="background-color: rgb(0, 0, 0); color: rgb(255, 242, 0);"><center>1 (-_-)</center></div>
      <div class="box" style="background-color: rgb(255, 242, 0); color: rgb(0, 0, 0);"><center>2 (O_O)</center></div>
    </div>
  </body>
</html>
