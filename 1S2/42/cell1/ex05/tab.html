<html lang="en">
  <head>

    <style>
      .table {
        display: flex;
      }
      .box {
        border: 1px solid black;
        width: 100%;
        padding: 50px 0px;
      }
    </style>
  </head>
  <body>
    <div class="table">
      <div class="box" style="background-color: rgb(0, 0, 0); color: rgb(255, 242, 0)"; ><center>1 (-_-)</center></div>
      <div class="box" style="background-color: rgb(255, 242, 0);"><center>2 (O_O)</center></div>
    </div>
  </body>
</html>
