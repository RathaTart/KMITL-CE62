<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .calculator {
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #fff;
            text-align: center;
        }
        .calculator div {
            margin-bottom: 10px;
        }
        .calculator input, .calculator select {
            padding: 5px;
            font-size: 16px;
            text-align: center;
        }
        .center-horizontal {
            margin: 0 auto;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div>
            <input type="keyboard" id="leftMember" placeholder="Input1">
        </div>
        <div class="center-horizontal"> <!-- Center the select element -->
            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>
        </div>
        <div>
            <input type="keyboard" id="rightMember" placeholder="Input2">
        </div>
        <div class="center-horizontal"> <!-- Center the button -->
            <input type="button" value="Try me!" id="calculateBtn">
        </div>
    </div>
    <!-- Include jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#calculateBtn').click(function() {
                const leftMember = $('#leftMember').val();
                const operator = $('#operator').val();
                const rightMember = $('#rightMember').val();

                if (isNaN(leftMember) || isNaN(rightMember) || leftMember === '' || rightMember === '' || leftMember < 0 || rightMember < 0){
                    alert('Error :(');
                    console.log('Error :(');
                    return;
                }

                const left = parseInt(leftMember);
                const right = parseInt(rightMember);
                let result;

                switch (operator) {
                    case '+':
                        result = left + right;
                        break;
                    case '-':
                        result = left - right;
                        break;
                    case '*':
                        result = left * right;
                        break;
                    case '/':
                        if (right === 0) {
                            alert('It’s over 9000!');
                            console.log('It’s over 9000!');
                            return;
                        }
                        result = left / right;
                        break;
                    case '%':
                        if (right === 0) {
                            alert('It’s over 9000!');
                            console.log('It’s over 9000!');
                            return;
                        }
                        result = left % right;
                        break;
                    default:
                        alert('Error :(');
                        console.log('Error :(');
                        return;
                }

                alert(`Result: ${result}`);
                console.log(`Result: ${result}`);
            });

            setInterval(() => {
                alert('Please, use me...');
            }, 30000);
        });
    </script>
</body>
</html>
