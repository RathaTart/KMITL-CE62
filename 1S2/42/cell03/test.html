<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Management</title>
    
    <style>
        main {
            margin: 50px;
        }
        .btn {
            padding: 10px 20px;
        }
        #ft_list {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid rgb(255, 255, 255);
        }
        .todo {
            padding: 5px;
            background-color: rgb(255, 255, 255);
            border: 1px solid rgb(0, 0, 0);
            margin-bottom: 5px;
        }
        .confirm-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgb(193, 193, 193);
            padding: 20px;
            border: 1px solid rgb(255, 255, 255);
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <main>
        <button class="btn" onclick="openPrompt()">New</button>
        <div id="ft_list"></div>
        <div id="confirmBox" class="confirm-box">
            <p>Are you sure you want to delete this task?</p>
            <button class="btn" id="deleteBtn" onclick="removeTask(true)">Yes</button>
            <button class="btn" onclick="removeTask(false)">No</button>
        </div>
    </main>
    <script src="todo.js"></script>
</body>
</html>
