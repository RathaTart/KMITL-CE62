<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        #new-task-btn {
            margin: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
        #ft_list {
            margin: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            max-width: 300px;
        }
        .todo-item {
            background-color: #f9f9f9;
            margin: 5px 0;
            padding: 10px;
            border: 1px solid #ddd;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="new-task-btn">New</button>
    <div id="ft_list"></div>
    <script src="todo.js"></script>
</body>
</html>
