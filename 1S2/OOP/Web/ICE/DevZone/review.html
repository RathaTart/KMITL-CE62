<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="homepagestyle.css">
    <link rel="stylesheet" href="loginstyle.css">
    <link rel="stylesheet" href="reviewstyle.css">
    <style>
        h1 {
            font-size: 24px; /* กำหนดขนาดตัวอักษรเป็น 24px */
            font-weight: bold; /* กำหนดให้ข้อความหนา */
            color: #333; /* กำหนดสีข้อความ */
        }
    </style> 
</head>
<body>
    
    <div class="container">
        <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
          <div class="col-md-3 mb-2 mb-md-0">
            <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
                MySite
            </a>
          </div>
    
          <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="homepage.html" class="nav-link px-2 link-secondary">Home</a></li>
            <li><a href="basket.html" class="nav-link px-2">Basket</a></li>
            <li><a href="menu.html" class="nav-link px-2">Menu</a></li>
            <li><a href="#" class="nav-link px-2">FAQs</a></li>
            <li><a href="review.html" class="nav-link px-2">Review</a></li>
          </ul>
    
          <div class="col-md-3 text-end">
            <button type="button" class="btn btn-outline-primary me-2" onclick="gotoLogin()">Login</button>
            <button type="button" class="btn btn-primary" onclick="gotoSignup()">Sign-up</button>
          </div>
        </header>
    </div>


    <main class="form-signin w-100 m-auto">
        <form id="basketForm">
            <h1>We need your review Thank you!!!</h1>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="reviewInput" placeholder="Review">
                <label for="reviewInput">Review</label>
            </div>
            <button class="btn btn-primary w-100 py-2" type="button" onclick="getformReview()">Submit</button>
            <div id="reviewComplete"></div>
            <div class="mt-3"></div>
        </form>
    
        <div id="responseMessage"></div>

    </main>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      function gotoLogin() {
        window.location.href = "login.html";
      }
      function gotoSignup() {
        window.location.href = "register.html";
      }
    </script>
    <script>

        async function getformReview() {
            const review = document.getElementById('reviewInput').value; // รับค่า review จาก input
            
            await fetch(`http://127.0.0.1:8001/add_review?review=${review}`,{
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authentication" : localStorage.getItem("Token")
                },
                // body: JSON.stringify({
                //     username: username,
                //     password: password,
                // })
            })
            .then(response => response.json())
            .then(data => {
                const review_complete = document.getElementById('reviewComplete');
                review_complete.textContent = "Your Review has been submitted successfully.";
                getReview();
                // const responseMessage = document.getElementById('responseMessage');
                // responseMessage.textContent = data.message; // แสดงข้อความที่ได้รับจาก response
            })
            .catch(error => {
                console.error('Error fetching data:', error);
            });
        }


        window.addEventListener('load', (event) => {
            getReview();
        });
        async function getReview() {
            await fetch(`http://127.0.0.1:8001/review`) // ใช้ userId และ review ที่รับมาจาก input
                .then(response => response.json())
                .then(data => {
                    const reviews = data.reviews; // รับข้อมูลรีวิวจาก response
                    const reviewContainer = document.getElementById('responseMessage');
                    reviewContainer.innerHTML = ''; // ล้างเนื้อหาที่มีอยู่ในคอนเทนเนอร์ก่อนที่จะเติมข้อมูลใหม่

                    reviews.forEach(review => {
                        const reviewElement = document.createElement('div');
                        reviewElement.classList.add('review');

                        const userIdElement = document.createElement('p');
                        userIdElement.textContent = `User ID: ${review.user_id}`;

                        const reviewTextElement = document.createElement('p');
                        reviewTextElement.textContent = `Review: ${review.review}`;

                        reviewElement.appendChild(userIdElement);
                        reviewElement.appendChild(reviewTextElement);

                        reviewContainer.appendChild(reviewElement);
                    });
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                });
        }

    </script>
</body>
</html>
