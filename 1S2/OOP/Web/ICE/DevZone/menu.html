        <h1 class="category_food"><img id="home-section-icon" class="home-section-icon" src="Pictures\pizza.png"> Pizza</h1>
        
        <div class="image-row">
                    <!-- ใช้ฟังก์ชัน gotoCustompizza() เพื่อเปิดหน้า custompizza.html และเก็บข้อมูล -->
            <img src="Pictures\pepperoni.jpg" alt="Image 1" class="image" onclick="gotoCustompizza('pepperoni')">
            <img src="Pictures\margherita.jpg" alt="Image 2" class="image" onclick="gotoCustompizza('margherita')">
            <img src="Pictures\hawaiian.jpg" alt="Image 3" class="image" onclick="gotoCustompizza('hawaiian')">
        </div>



        <h1 class="category_food"><img id="home-section-icon" class="home-section-icon" src="Pictures\drinks.png"> Drinks</h1>

        <div class="image-row">
            <img src="Pictures\Drink1.jpg" alt="Image 1" class="image" onclick="gotoDrinks('Drink1')">
            <img src="Pictures\Drink2.jpg" alt="Image 2" class="image" onclick="gotoDrinks('Drink2')">
            <img src="Pictures\Drink3.jpg" alt="Image 3" class="image" onclick="gotoDrinks('Drink3')">
        </div>

        <h1 class="category_food"><img id="home-section-icon" class="home-section-icon" src="Pictures\Combo.png"> COMBO</h1>

        <div class="image-row">
            <img src="Pictures\Combo1.jpg" alt="Image 1" class="image" onclick="gotoCombo('Combo1')">
            <img src="Pictures\Combo2.jpg" alt="Image 2" class="image" onclick="gotoCombo('Combo2')">
            <img src="Pictures\Combo3.jpg" alt="Image 3" class="image" onclick="gotoCombo('Combo3')">
        </div>  

        
    </div>

        function gotoCustompizza(pizzaName) {
            window.location.href = "custompizza.html?pizza=" + pizzaName;
        }

        function gotoDrinks(drinkName) {
            window.location.href = "custompizza.html?drink=" + drinkName;
        }

        function gotoCombo(comboName) {
            window.location.href = "custompizza.html?combo=" + comboName;
        }

        function gotoLogin() {
            window.location.href = "login.html";
        }
        function gotoSignup() {
            window.location.href = "register.html";
