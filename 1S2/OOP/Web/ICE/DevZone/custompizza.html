<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="homepagestyle.css">
    <link rel="stylesheet" href="menuhomepagestyle.css">
    <style>
        h1 {
            font-size: 24px; /* กำหนดขนาดตัวอักษรเป็น 24px */
            font-weight: bold; /* กำหนดให้ข้อความหนา */
            color: #333; /* กำหนดสีข้อความ */
        }
        /* CSS สำหรับกำหนดขนาดรูปภาพ */
        #pizzaImageContainer img {
            width: 200px; /* กำหนดความกว้างเป็น 200px */
            height: auto; /* ให้ความสูงปรับอัตโนมัติเพื่อให้รักษาสัดส่วนของรูปภาพ */
        }
    
        #drinkImageContainer img {
            width: 150px; /* กำหนดความกว้างเป็น 150px */
            height: auto; /* ให้ความสูงปรับอัตโนมัติเพื่อให้รักษาสัดส่วนของรูปภาพ */
        }
    </style>    
</head>
<body>
    
    <div class="container">
        <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
          <div class="col-md-3 mb-2 mb-md-0">
            <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
                MySite
            </a>
          </div>
    
          <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="homepage.html" class="nav-link px-2 link-secondary">Home</a></li>
            <li><a href="basket.html" class="nav-link px-2">Basket</a></li>
            <li><a href="menu.html" class="nav-link px-2">Menu</a></li>
            <li><a href="#" class="nav-link px-2">FAQs</a></li>
            <li><a href="review.html" class="nav-link px-2">Review</a></li>
          </ul>
    
          <div class="col-md-3 text-end">
            <button type="button" class="btn btn-outline-primary me-2" onclick="gotoLogin()">Login</button>
            <button type="button" class="btn btn-primary" onclick="gotoSignup()">Sign-up</button>
          </div>
        </header>


        <h1>Your Order</h1>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div id="pizzaImageContainer"></div>
            <div>
                <form id="orderForm" action="basket.html" method="GET" class="d-flex align-items-center mb-2">
                    <label for="size" class="me-2">Choose Size:</label>
                    <select name="size" id="size" class="me-2">
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                    </select>
                    <label for="quantity" class="me-2">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" min="1" max="5">
                    <!-- <button type="submit" class="btn btn-primary">Add order To Basket</button> -->
                    <button class="btn btn-primary w-100 py-2" type="button" onclick="addBasket()">Add To Basket</button>

                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        window.onload = function() {
            // ดึงข้อมูลจาก Query String
            var queryString = window.location.search;
            var urlParams = new URLSearchParams(queryString);
            var selectedPizza = urlParams.get('pizza');
            var selectedDrink = urlParams.get('drink');

            localStorage.setItem('selectedPizza', selectedPizza);
            console.log(selectedPizza);
            // สร้าง element รูปภาพ
            if (selectedDrink) {
                var drinkImage = document.createElement('img');
                drinkImage.src = 'Pictures/' + selectedDrink + '.jpg'; // เปลี่ยน path ตามที่คุณต้องการ
                drinkImage.alt = selectedDrink;
                // เพิ่มรูปภาพลงใน containers
                document.getElementById('drinkImageContainer').appendChild(drinkImage);
            } else {
                var pizzaImage = document.createElement('img');
                pizzaImage.src = 'Pictures/' + selectedPizza + '.jpg'; // เปลี่ยน path ตามที่คุณต้องการ
                pizzaImage.alt = selectedPizza;
                // เพิ่มรูปภาพลงใน container
                document.getElementById('pizzaImageContainer').appendChild(pizzaImage);
            }
        };

        function addBasket() {
            var queryString = window.location.search;
            var urlParams = new URLSearchParams(queryString);
            var selectedPizza = urlParams.get('pizza');
            var selectedSize = document.getElementById('size').value;
            var selectedQuantity = document.getElementById('quantity').value;

            // Construct the URL with selected pizza details as query parameters
            var basketUrl = "basket.html?pizza=" + selectedPizza + "&size=" + selectedSize + "&quantity=" + selectedQuantity;

            // Redirect the user to the basket page with selected pizza details
            window.location.href = basketUrl;
        }

        
        function gotoLogin() {
            window.location.href = "login.html";
        }
        function gotoSignup() {
            window.location.href = "register.html";
        }
    </script>
</body>
</html>
