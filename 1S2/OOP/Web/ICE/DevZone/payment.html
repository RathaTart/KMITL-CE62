<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Login & Register CSS -->
    <link rel="stylesheet" href="loginstyle.css">
    <style>
        h1 {
            font-size: 24px; /* กำหนดขนาดตัวอักษรเป็น 24px */
            font-weight: bold; /* กำหนดให้ข้อความหนา */
            color: #333; /* กำหนดสีข้อความ */
        }
    </style> 
</head>
<body>
    
    <div class="container">
        <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
          <div class="col-md-3 mb-2 mb-md-0">
            <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
                MySite
            </a>
          </div>
    
          <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="homepage.html" class="nav-link px-2 link-secondary">Home</a></li>
            <li><a href="basket.html" class="nav-link px-2">Basket</a></li>
            <li><a href="menu.html" class="nav-link px-2">Menu</a></li>
            <li><a href="#" class="nav-link px-2">FAQs</a></li>
            <li><a href="review.html" class="nav-link px-2">Review</a></li>
          </ul>
    
          <div class="col-md-3 text-end">
            <button type="button" class="btn btn-outline-primary me-2" onclick="gotoLogin()">Login</button>
            <button type="button" class="btn btn-primary" onclick="gotoSignup()">Sign-up</button>
          </div>
          
        </header>
    </div>

    <main class="form-signin w-100 m-auto">
        <h1>Your Payment</h1>
        <!-- เพิ่มส่วนสำหรับแสดงข้อความผิดพลาด -->
        <div id="errorMessage" class="alert alert-danger mt-3" style="display: none;"></div>

        <!-- เพิ่มส่วนสำหรับแสดงตารางผลลัพธ์ -->
        <div id="stockResult" style="display: none;">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">Item</th>
                        <th scope="col">Size</th>
                        <th scope="col">Quantity</th>
                    </tr>
                </thead>
                <tbody id="stockList">
                    <!-- Stock items will be dynamically added here -->
                </tbody>
            </table>
        </div>

        <button class="btn btn-primary w-100 py-2 mt-2 mb-4" type="button" onclick="gotoMenu()">More? goto add more!!!</button>
        <button class="btn btn-primary w-100 py-2" type="button" onclick="gotoPayment()">OK? goto payment</button>

    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        window.addEventListener('load', (event) => {
            getBasket();
        });

        async function getBasket() {
            await fetch(`http://127.0.0.1:8001/basket`,{
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "Authentication" : localStorage.getItem("Token")
                },

            })
                .then(response => response.json())
                .then(data => {
                    if (data && data.pizza_list && data.pizza_list.length > 0) {
                        const stockList = document.getElementById('stockList');
                        stockList.innerHTML = ''; // Clear previous data
                                
                        data.pizza_list.forEach(item => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${item._Pizza_item__pizza._Pizza__face}</td>
                                <td>${item._Pizza_item__size}</td>
                                <td>${item._Pizza_item__quantity}</td>
                            `;
                            stockList.appendChild(row);
                        });
                        // Show the result section
                        document.getElementById('stockResult').style.display = 'block';
                    } else {
                        const errorMessageElement = document.getElementById('errorMessage');
                        errorMessageElement.textContent = 'No data or invalid data format';
                        errorMessageElement.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                });
        }

        function gotoLogin() {
            window.location.href = "login.html";
        }

        function gotoSignup() {
            window.location.href = "register.html";
        }

        function gotoMenu() {
            window.location.href = "menu.html";
        }

        function gotoPayment() {
            window.location.href = "payment.html";
        }
    </script>

</body>
</html>
