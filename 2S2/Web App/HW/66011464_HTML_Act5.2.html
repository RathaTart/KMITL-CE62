<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Entry Form</title>
</head>
<body>
    <form action>
        <fieldset>
            <legend>Contact Information:</legend>
            <label for="first-name">First name:</label>
            <input type="text" id="first-name"><br><br>
            
            <label for="last-name">Last name:</label>
            <input type="text" id="last-name"><br><br>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email"><br><br>
        </fieldset>
        <br>

        <fieldset>
            <legend>Competition Question:</legend>
            <p>How tall is the Eiffel Tower in Paris, France?</p>
            <input type="radio" id="option1" name="eiffel-tower-height">
            <label for="option1">584ft</label><br>
            
            <input type="radio" id="option2" name="eiffel-tower-height">
            <label for="option2">784ft</label><br>
            
            <input type="radio" id="option3" name="eiffel-tower-height">
            <label for="option3">984ft</label><br>
            
            <input type="radio" id="option4" name="eiffel-tower-height">
            <label for="option4">1184ft</label><br><br>
        </fieldset>
        <br>

        <fieldset>
            <legend>Tiebreaker Question:</legend>
            <label for="tiebreaker">In 25 words or less, say why you would like to win $10,000:</label><br>
            <textarea id="tiebreaker" rows="10" cols="50"></textarea>
        </fieldset>
        <br>

        <fieldset>
            <legend>Enter competition</legend>
            <button type="button">Enter Competition</button>
        </fieldset>
    </form>
</body>
</html>
