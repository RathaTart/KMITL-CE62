        <script>
        const worker = new Worker('worker.js');
            var isrunning = false;

            function startWorker() {
                worker.postMessage('start');
                worker.onmessage = function (e) {
                    timebutton.innerHTML = e.data.date;
                    Object.assign(timebutton.style, {
                        color: e.data.textColor,
                        backgroundColor: e.data.backgroundColor,
                        position: 'fixed',
                        top : 0,
                        right : 0,
                    });
                };
                isrunning = true;
            }

            function stopWorker() {
                worker.postMessage('stop');
                isrunning = false;
                Object.assign(timebutton.style, {
                    position: null,
                });
            }

            timebutton.addEventListener('click', () => {
                if (isrunning) {
                    stopWorker();
                } else {
                    startWorker();
                }
            });





        function togglePersonalInfo() {
            const info = document.getElementById('personal-info-details');
            if (info.classList.contains('hidden')) {
                info.classList.remove('hidden');
                info.classList.add('visible');
            } else {
                info.classList.remove('visible');
                info.classList.add('hidden');
            }
        }

        function changeImage(imageType) {
            const img = document.getElementById('snapshot-image');
            switch (imageType) {
                case 'fireworks':
                    img.src = 'https://static.vecteezy.com/system/resources/thumbnails/002/475/549/small_2x/colorful-firework-background-free-vector.jpg';
                    break;
                case 'crest':
                    img.src = 'https://www.vojtechruzicka.com/static/edd60b6a3cb6d8de78c5117d8d6d13b3/5aac0/premium.png'; 
                    break;
                case 'action':
                    img.src = 'https://t4.ftcdn.net/jpg/00/72/76/37/240_F_72763724_by9TH6BAQWZAYjC7llpKKmhHweEak7VC.jpg';
                    break;
                case 'buffalo':
                    img.src = 'https://www.tetonscience.org/wp-content/uploads/2019/07/Screen-Shot-2019-07-18-at-10.48.10-AM-1024x777.png';
                    break;
            }
        }
    </script>
